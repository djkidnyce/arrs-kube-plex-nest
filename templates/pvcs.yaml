{{- if .Values.sabnzbd.downloads.enabled }}
---
# SABnzbd local download scratch (incomplete + unpack). Off the SMB share on
# purpose: keeps heavy random I/O on local disk.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sabnzbd-downloads
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/resource-policy: keep
