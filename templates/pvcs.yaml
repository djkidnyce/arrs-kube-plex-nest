# ─────────────────────────────────────────────────────────────────────────────
# Config PVCs — one per service, RWO (local-path or default StorageClass)
# Plex config PVCs are NOT here — they're in the StatefulSet volumeClaimTemplates.
# ─────────────────────────────────────────────────────────────────────────────

{{- $ns := .Release.Namespace }}
{{- $labels := include "akpn.labels" . }}

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sabnzbd-config
  namespace: {{ $ns }}
  annotations:
    helm.sh/resource-policy: keep
  labels:
    {{- $labels | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.sabnzbd.configStorageSize }}
{{- if .Values.sonarr.enabled }}
