name: chart-ci
on:
  push:
    branches: ["main", "hardening-fixes"]
  pull_request:

jobs:
  lint-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v3.16.4

      - name: helm lint
        run: helm lint . --set nas.host=192.168.1.100 --strict

      # Rendered output is written inside the workspace, not /tmp: the
      # kubeconform step runs in a container that only mounts the workspace.
      - name: helm template (default values)
        run: |
          helm template akpn . --namespace media --set nas.host=192.168.1.100 > rendered.yaml
          echo "--- rendered $(grep -c '^kind:' rendered.yaml) resources"

      - name: helm template (clamav disabled, 3 plex replicas)
        run: |
          helm template akpn . --namespace media \
            --set nas.host=192.168.1.100 \
            --set clamav.enabled=false \
            --set plex.replicas=3 > rendered-alt.yaml

      - name: nas.host is required
        run: |
          if helm template akpn . --namespace media > /dev/null 2>&1; then
            echo "ERROR: render succeeded without nas.host"; exit 1
          fi
          echo "OK: render fails without nas.host"

      - name: kubeconform
        uses: docker://ghcr.io/yannh/kubeconform:v0.8.0-alpine@sha256:6b90a5f23d846140ce0194fe050b1995e546eba938f3a6bf10c039dd5e24588f
        with:
          entrypoint: /kubeconform
          args: "-strict -summary rendered.yaml rendered-alt.yaml"

      - name: shellcheck
        run: |
          sudo apt-get install -y shellcheck
          shellcheck -S warning deploy.sh install-tools.sh files/scripts/*.sh

      - name: backup script tests
        run: python3 tests/test_backup.py

      - name: sab-seed script tests
        run: sh tests/test_sab_seed.sh

      - name: clamav scan find tests
        run: |
          sudo apt-get install -y busybox
          sh tests/test_scan_find.sh

      - name: offline cross-reference tests
        run: |
          pip install pyyaml kubernetes-validate
          python3 tests/validate.py rendered.yaml
